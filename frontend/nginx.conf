server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Legal documents / condition photos can be sizeable — same headroom as LMS.
    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 300;
        proxy_request_buffering off;
    }

    # Fingerprinted build assets live under /static/ (not /assets/ — the app's
    # own asset-registry route is at /assets, which this location must not
    # shadow, or hard-refreshing /assets/<id> would 404 instead of falling
    # through to the SPA below).
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
